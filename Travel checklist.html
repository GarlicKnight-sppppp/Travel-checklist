<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<title>旅行清单</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --line:#e8ebef;
    --text:#1a1d21; --muted:#8b939c;
    --solid:#1e293b; --solid-text:#ffffff;
    --hover:#f1f3f6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f172a; --card:#1e293b; --line:#334155;
      --text:#e2e8f0; --muted:#94a3b8;
      --solid:#475569; --solid-text:#f1f5f9;
      --hover:#334155;
    }
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  input,select,textarea{font-family:inherit;font-size:16px;color:inherit}

  /* ---------- 顶部 ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--card);border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top,0px);
  }
  .topbar-row{
    max-width:820px;margin:0 auto;
    padding:10px 14px 4px;
    display:flex;align-items:center;gap:8px;
  }
  .title{
    flex:1;min-width:0;
    font-size:18px;font-weight:700;letter-spacing:-.01em;
    padding:4px 6px;margin-left:-6px;border-radius:8px;
    outline:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .title:focus{background:var(--hover);white-space:normal}
  .icon-btn{
    width:38px;height:38px;flex:0 0 auto;
    border:1px solid var(--line);background:var(--card);color:var(--text);
    border-radius:11px;font-size:18px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:.15s;
  }
  .icon-btn:active{background:var(--hover)}
  .icon-btn.primary{
    background:var(--solid);border-color:var(--solid);color:var(--solid-text);
    font-size:20px;font-weight:400;
  }

  /* ---------- 页签 ---------- */
  .tabs{
    max-width:820px;margin:0 auto;
    padding:2px 14px 10px;
    display:flex;gap:6px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line);background:var(--card);color:var(--text);
    padding:7px 13px;border-radius:99px;font-size:13px;font-weight:500;
    transition:.15s;white-space:nowrap;
  }
  .tab.active{background:var(--solid);border-color:var(--solid);color:var(--solid-text)}
  .tab .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .tab .cnt{font-size:11px;opacity:.55;font-variant-numeric:tabular-nums}

  /* ---------- 主体 ---------- */
  main{
    max-width:820px;margin:0 auto;
    padding:16px 14px calc(80px + env(safe-area-inset-bottom,0px));
  }

  .day-block{margin-bottom:24px}
  .day-head{
    display:flex;align-items:center;gap:8px;
    margin-bottom:10px;padding-bottom:8px;
    border-bottom:2px solid var(--line);
  }
  .day-badge{
    background:var(--solid);color:var(--solid-text);
    font-size:12px;font-weight:700;
    padding:3px 10px;border-radius:6px;
    letter-spacing:.02em;flex:0 0 auto;
  }
  .day-count{
    font-size:12px;color:var(--muted);
    margin-left:auto;font-variant-numeric:tabular-nums;
  }

  /* ---------- 行程条目 ---------- */
  .item{
    display:flex;gap:4px;align-items:flex-start;
    background:var(--card);border:1px solid var(--line);
    border-radius:13px;
    padding:12px 6px 12px 14px;
    margin-bottom:8px;
    box-shadow:0 1px 2px rgba(16,24,40,.04);
    transition:.15s;
  }
  .item-main{flex:1;min-width:0}
  .item-meta{
    display:flex;align-items:center;gap:8px;
    margin-bottom:5px;flex-wrap:wrap;
  }
  .chip{
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;
    color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);
    white-space:nowrap;flex:0 0 auto;
  }
  .time{
    font-size:13px;font-weight:700;color:var(--muted);
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  }
  .item-title{
    font-size:15px;font-weight:600;
    line-height:1.45;word-break:break-word;
  }
  .note{
    font-size:14px;color:var(--muted);
    line-height:1.7;margin-top:7px;
    white-space:pre-wrap;word-break:break-word;
  }
  .note.collapsed{
    display:-webkit-box;
    -webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden;
  }
  .expand-btn{
    background:none;border:none;
    color:#3b82f6;font-size:13px;font-weight:600;
    padding:8px 0 0;display:inline-block;
  }
  .more-btn{
    width:38px;height:38px;flex:0 0 auto;
    border:none;background:transparent;color:var(--muted);
    font-size:20px;line-height:1;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    margin-top:-4px;
  }
  .more-btn:active{background:var(--hover)}

  /* 图片：横向滑动 */
  .imgs{
    display:flex;gap:8px;
    margin-top:10px;
    margin-left:-14px;margin-right:-6px;
    padding:2px 6px 2px 14px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .imgs::-webkit-scrollbar{display:none}
  .imgs img{
    flex:0 0 auto;
    width:92px;height:92px;object-fit:cover;
    border-radius:11px;border:1px solid var(--line);
  }

  .empty{
    text-align:center;padding:70px 20px;
    color:var(--muted);font-size:14px;
  }
  .empty span{font-size:13px;opacity:.75}

  /* ---------- 弹窗 ---------- */
  .modal-mask{
    position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;
    display:none;align-items:center;justify-content:center;padding:16px;
    backdrop-filter:blur(2px);
  }
  .modal-mask.show{display:flex}
  .modal{
    background:var(--card);border-radius:18px;
    width:100%;max-width:520px;max-height:88vh;overflow:auto;
    padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);
    animation:pop .18s ease-out;
  }
  @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
  .modal h2{font-size:17px;margin-bottom:4px}
  .modal .hint{font-size:12px;color:var(--muted);margin-bottom:14px}

  .field{display:block;margin-bottom:13px}
  .field > span{
    display:block;font-size:12px;font-weight:600;
    color:var(--muted);margin-bottom:5px;
  }
  .field input[type=text],.field input[type=time],.field input[type=date],
  .field select,.field textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;background:var(--card);color:var(--text);
    outline:none;transition:.15s;
  }
  /* 让日期选择器在深色模式下也好看 */
  .field input[type=date]{color-scheme: light dark;}
  .field input:focus,.field select:focus,.field textarea:focus{
    border-color:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.18);
  }
  .field textarea{resize:vertical;min-height:76px;line-height:1.6}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .img-grid{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:9px}
  .img-thumb{position:relative;width:72px;height:72px}
  .img-thumb img{
    width:100%;height:100%;object-fit:cover;
    border-radius:9px;border:1px solid var(--line);
  }
  .img-thumb button{
    position:absolute;top:-6px;right:-6px;
    width:24px;height:24px;border-radius:50%;
    background:var(--solid);color:var(--solid-text);
    border:2px solid var(--card);
    font-size:13px;line-height:1;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .upload{
    display:inline-flex;align-items:center;gap:5px;
    border:1px dashed var(--line);border-radius:10px;
    padding:10px 16px;font-size:13px;color:var(--muted);
    cursor:pointer;transition:.15s;
  }
  .upload:active{background:var(--hover)}

  .modal-actions{
    display:flex;justify-content:flex-end;gap:8px;
    margin-top:18px;padding-top:16px;
    border-top:1px solid var(--line);
  }
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--text);
    padding:10px 16px;border-radius:10px;
    font-size:14px;font-weight:500;transition:.15s;
  }
  .btn:active{background:var(--hover)}
  .btn.primary{
    background:var(--solid);border-color:var(--solid);color:var(--solid-text);
  }

  /* 分类管理 */
  .cat-row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .cat-row input[type=color]{
    width:38px;height:38px;padding:0;
    border:1px solid var(--line);border-radius:10px;
    background:none;cursor:pointer;flex:0 0 auto;
  }
  .cat-row input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
  .cat-row input[type=color]::-webkit-color-swatch{border:none;border-radius:7px}
  .cat-row input[type=text]{
    flex:1;min-width:0;border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;
    background:var(--card);color:var(--text);outline:none;
  }
  .cat-row input[type=text]:focus{border-color:#94a3b8}
  .cat-row .del{
    background:none;border:none;color:var(--muted);
    font-size:13px;padding:8px 10px;border-radius:8px;flex:0 0 auto;
  }
  .cat-row .del:active{background:#fee2e2;color:#dc2626}
  .add-cat{width:100%;text-align:center;border-style:dashed;margin-top:4px}

  /* ---------- 底部操作面板 ---------- */
  .sheet-mask{
    position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet-mask.show{display:flex}
  .sheet{
    background:var(--card);width:100%;max-width:520px;
    border-radius:18px 18px 0 0;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
    animation:slideUp .2s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(100%)}}
  .sheet button{
    display:block;width:100%;
    padding:16px;border:none;background:none;
    font-size:16px;font-weight:500;color:var(--text);
    border-radius:12px;text-align:center;
  }
  .sheet button:active{background:var(--hover)}
  .sheet button.danger{color:#ef4444}
  .sheet button.cancel{color:var(--muted);font-size:15px}

  /* ---------- 图片预览 ---------- */
  .lightbox{
    position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:80;
    display:none;align-items:center;justify-content:center;
    padding:20px;
  }
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}

  /* ---------- 小屏微调 ---------- */
  @media (max-width:400px){
    .title{font-size:17px}
    .item{padding:11px 4px 11px 13px}
    .imgs img{width:84px;height:84px}
  }
  @media print{
    .topbar,.more-btn,.expand-btn,.icon-btn{display:none!important}
    .note.collapsed{display:block!important;-webkit-line-clamp:unset}
    .imgs{overflow:visible!important;flex-wrap:wrap!important}
    .imgs img{width:80px;height:80px}
    body{background:#fff!important}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1 class="title" id="title" contenteditable="true" spellcheck="false"></h1>
    <button class="icon-btn primary" id="addBtn" aria-label="添加行程">＋</button>
    <button class="icon-btn" id="menuBtn" aria-label="更多">⋯</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="list"></main>

<!-- 编辑 / 添加 -->
<div class="modal-mask" id="editMask">
  <div class="modal">
    <h2 id="editTitle">添加行程</h2>
    <p class="hint" id="editHint">点击日期打开系统日历选择</p>

    <div class="row2">
      <label class="field"><span>日期</span>
        <input type="date" id="fDate"></label>
      <label class="field"><span>时间</span>
        <input type="time" id="fTime"></label>
    </div>

    <label class="field"><span>分类</span><select id="fCat"></select></label>
    <label class="field"><span>标题</span>
      <input type="text" id="fTitle" placeholder="例如：抵达天府机场"></label>
    <label class="field"><span>备注</span>
      <textarea id="fNote" placeholder="地址、电话、注意事项……"></textarea></label>

    <div class="field">
      <span>图片</span>
      <div class="img-grid" id="fImgs"></div>
      <label class="upload">+ 添加图片
        <input type="file" id="fFile" accept="image/*" multiple hidden></label>
    </div>

    <div class="modal-actions">
      <button class="btn" data-close="editMask">取消</button>
      <button class="btn primary" id="fSave">保存</button>
    </div>
  </div>
</div>

<!-- 分类管理 -->
<div class="modal-mask" id="catMask">
  <div class="modal">
    <h2>分类管理</h2>
    <p class="hint">改名字、换颜色，或添加自己的分类</p>
    <div id="catList"></div>
    <button class="btn add-cat" id="catAdd">+ 添加分类</button>
    <div class="modal-actions">
      <button class="btn primary" data-close="catMask">完成</button>
    </div>
  </div>
</div>

<!-- 顶部菜单 -->
<div class="sheet-mask" id="menuMask">
  <div class="sheet">
    <button data-menu="cat">分类管理</button>
    <button data-menu="export">导出 JSON</button>
    <button data-menu="import">导入 JSON</button>
    <button data-menu="print">打印 / 导出 PDF</button>
    <button data-menu="cancel" class="cancel">取消</button>
  </div>
</div>

<!-- 单条操作 -->
<div class="sheet-mask" id="itemMask">
  <div class="sheet">
    <button data-item="edit">编辑</button>
    <button data-item="del" class="danger">删除</button>
    <button data-item="cancel" class="cancel">取消</button>
  </div>
</div>

<!-- 图片预览 -->
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* =========================================================
   数据层
   ========================================================= */
const LS_KEY = 'travel-list-v1';
const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function defaultState() {
  return {
    title: '我的旅行清单',
    categories: [
      { id: 'c1', name: '交通', color: '#3b82f6' },
      { id: 'c2', name: '景点', color: '#10b981' },
      { id: 'c3', name: '餐饮', color: '#f59e0b' },
      { id: 'c4', name: '住宿', color: '#8b5cf6' },
      { id: 'c5', name: '购物', color: '#ec4899' },
      { id: 'c6', name: '其他', color: '#64748b' }
    ],
    items: []
  };
}

let state;
try {
  state = JSON.parse(localStorage.getItem(LS_KEY)) || defaultState();
  if (!Array.isArray(state.items)) state.items = [];
  if (!Array.isArray(state.categories)) state.categories = [];
} catch (e) { state = defaultState(); }

function save() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  } catch (e) {
    alert('保存失败：本地存储空间不足。\n建议先「导出」备份，再删掉部分图片。');
  }
}

/* =========================================================
   工具
   ========================================================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

const catOf = id => state.categories.find(c => c.id === id);

/* 日期排序键：YYYY-MM-DD 优先，兼容旧数据 Day N */
function dateSortKey(d) {
  if (!d) return 999999;
  const s = String(d);
  if (s.includes('-')) {
    const p = s.split('-');
    if (p.length === 3) return (+p[0]) * 10000 + (+p[1]) * 100 + (+p[2]);
  }
  const m = s.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 999999;
}

/* 把 YYYY-MM-DD 渲染成「10月4日 周日」 */
function formatDateLabel(dateStr) {
  if (!dateStr) return '未安排';
  const p = String(dateStr).split('-');
  if (p.length === 3) {
    const d = new Date(dateStr);
    if (!isNaN(d.getTime())) {
      const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      return `${parseInt(p[1], 10)}月${parseInt(p[2], 10)}日 ${days[d.getDay()]}`;
    }
  }
  return dateStr; /* 兼容旧数据 "Day 1" */
}

function sortItems(arr) {
  return arr.slice().sort((a, b) => {
    const ka = dateSortKey(a.date), kb = dateSortKey(b.date);
    if (ka !== kb) return ka - kb;
    const ta = a.time || '99:99', tb = b.time || '99:99';
    return ta < tb ? -1 : ta > tb ? 1 : 0;
  });
}

function compressImage(file, maxSize = 1000, quality = 0.75) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onerror = () => resolve(null);
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => resolve(null);
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   渲染
   ========================================================= */
const titleEl = document.getElementById('title');
const tabsEl  = document.getElementById('tabs');
const listEl  = document.getElementById('list');
let activeCat = 'all';

function initTitle() {
  titleEl.textContent = state.title || '旅行清单';
  document.title = state.title || '旅行清单';
}

function renderTabs() {
  const counts = {};
  state.items.forEach(it => { counts[it.catId] = (counts[it.catId] || 0) + 1; });

  let html = `<button class="tab ${activeCat === 'all' ? 'active' : ''}" data-cat="all">
      全部<span class="cnt">${state.items.length}</span></button>`;

  state.categories.forEach(c => {
    html += `<button class="tab ${activeCat === c.id ? 'active' : ''}" data-cat="${c.id}">
      <span class="dot" style="background:${c.color}"></span>${esc(c.name)}
      <span class="cnt">${counts[c.id] || 0}</span></button>`;
  });

  tabsEl.innerHTML = html;
}

function itemHTML(it) {
  const c = catOf(it.catId);
  const color = c ? c.color : '#94a3b8';
  const catName = c ? c.name : '未分类';

  const timeHtml = it.time ? `<span class="time">${esc(it.time)}</span>` : '';

  const noteText = it.note || '';
  const needCollapse = noteText.length > 80;
  const noteHtml = noteText
    ? `<p class="note${needCollapse ? ' collapsed' : ''}">${esc(noteText)}</p>
       ${needCollapse ? `<button class="expand-btn" data-act="expand">展开 ▾</button>` : ''}`
    : '';

  const imgs = it.images || [];
  const imgsHtml = imgs.length
    ? `<div class="imgs">${imgs.map(s => `<img src="${s}" alt="">`).join('')}</div>`
    : '';

  return `
  <article class="item" data-id="${it.id}">
    <div class="item-main">
      <div class="item-meta">
        <span class="chip" style="--c:${color}">${esc(catName)}</span>
        ${timeHtml}
      </div>
      <h3 class="item-title">${esc(it.title)}</h3>
      ${noteHtml}
      ${imgsHtml}
    </div>
    <button class="more-btn" data-act="more" aria-label="更多操作">⋯</button>
  </article>`;
}

function renderList() {
  const filtered = state.items.filter(
    it => activeCat === 'all' || it.catId === activeCat
  );

  if (!filtered.length) {
    listEl.innerHTML = `<div class="empty">这里还没有内容<br><span>点右上角「＋」开始记录</span></div>`;
    return;
  }

  const groups = new Map();
  sortItems(filtered).forEach(it => {
    const key = it.date || '';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  });

  let html = '';
  groups.forEach((items, dateKey) => {
    html += `
      <section class="day-block">
        <div class="day-head">
          <span class="day-badge">${esc(formatDateLabel(dateKey))}</span>
          <span class="day-count">${items.length} 项</span>
        </div>
        ${items.map(itemHTML).join('')}
      </section>`;
  });

  listEl.innerHTML = html;
}

function renderAll() {
  renderTabs();
  renderList();
}

/* =========================================================
   页签切换
   ========================================================= */
tabsEl.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  activeCat = tab.dataset.cat;
  renderTabs();
  renderList();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* =========================================================
   清单交互
   ========================================================= */
let currentItemId = null;

listEl.addEventListener('click', e => {
  /* 图片预览 */
  const img = e.target.closest('.imgs img');
  if (img) { openLightbox(img.src); return; }

  /* 展开 / 收起备注 */
  const expandBtn = e.target.closest('[data-act="expand"]');
  if (expandBtn) {
    const note = expandBtn.previousElementSibling;
    const collapsed = note.classList.toggle('collapsed');
    expandBtn.textContent = collapsed ? '展开 ▾' : '收起 ▴';
    return;
  }

  /* 更多操作 */
  const moreBtn = e.target.closest('[data-act="more"]');
  if (moreBtn) {
    currentItemId = moreBtn.closest('.item').dataset.id;
    document.getElementById('itemMask').classList.add('show');
    return;
  }
});

/* =========================================================
   图片预览
   ========================================================= */
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('show');
}
lightbox.addEventListener('click', () => {
  lightbox.classList.remove('show');
  lightboxImg.src = '';
});

/* =========================================================
   编辑弹窗
   ========================================================= */
const editMask = document.getElementById('editMask');
let editingId = null;
let editingImages = [];

function openEdit(id) {
  editingId = id || null;
  const it = id ? state.items.find(i => i.id === id) : null;

  document.getElementById('editTitle').textContent = it ? '编辑行程' : '添加行程';
  document.getElementById('editHint').textContent = it
    ? '修改完点保存即可'
    : '点击日期打开系统日历选择';

  const dateInput = document.getElementById('fDate');
  /* 如果是旧数据 "Day 1"，日期框会留空，让用户重新选 */
  dateInput.value = (it?.date && it.date.includes('-')) ? it.date : '';
  document.getElementById('fTime').value = it?.time || '';

  const sel = document.getElementById('fCat');
  sel.innerHTML = state.categories.length
    ? state.categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')
    : '<option value="">（还没有分类）</option>';
  sel.value = it?.catId || (state.categories[0]?.id || '');

  document.getElementById('fTitle').value = it?.title || '';
  document.getElementById('fNote').value = it?.note || '';

  editingImages = it ? [...(it.images || [])] : [];
  renderEditImages();

  editMask.classList.add('show');
  setTimeout(() => document.getElementById('fTitle').focus(), 60);
}

function renderEditImages() {
  document.getElementById('fImgs').innerHTML = editingImages.map((src, i) => `
    <div class="img-thumb">
      <img src="${src}" alt="">
      <button type="button" data-rm="${i}" aria-label="移除">×</button>
    </div>`).join('');
}

document.getElementById('fImgs').addEventListener('click', e => {
  const b = e.target.closest('[data-rm]');
  if (!b) return;
  editingImages.splice(+b.dataset.rm, 1);
  renderEditImages();
});

document.getElementById('fFile').addEventListener('change', async e => {
  const files = [...e.target.files];
  for (const f of files) {
    const data = await compressImage(f);
    if (data) editingImages.push(data);
  }
  e.target.value = '';
  renderEditImages();
});

document.getElementById('fSave').addEventListener('click', () => {
  const titleField = document.getElementById('fTitle');
  const title = titleField.value.trim();
  if (!title) {
    titleField.focus();
    titleField.style.borderColor = '#f87171';
    setTimeout(() => titleField.style.borderColor = '', 1200);
    return;
  }

  const dateVal = document.getElementById('fDate').value; /* 标准格式 YYYY-MM-DD */
  
  const data = {
    date: dateVal,
    time: document.getElementById('fTime').value,
    catId: document.getElementById('fCat').value || null,
    title,
    note: document.getElementById('fNote').value.trim(),
    images: editingImages
  };

  if (editingId) {
    Object.assign(state.items.find(i => i.id === editingId), data);
  } else {
    state.items.push({ id: uid(), ...data });
  }

  save();
  editMask.classList.remove('show');
  renderAll();
});

/* =========================================================
   分类管理
   ========================================================= */
const catMask = document.getElementById('catMask');
const catListEl = document.getElementById('catList');

function renderCatList() {
  catListEl.innerHTML = state.categories.map(c => `
    <div class="cat-row" data-id="${c.id}">
      <input type="color" value="${c.color}" data-role="color" title="换颜色">
      <input type="text" value="${esc(c.name)}" data-role="name" placeholder="分类名">
      <button class="del" data-role="del">删除</button>
    </div>`).join('') || '<p class="hint" style="margin:0 0 10px">还没有分类，点下面添加</p>';
}

catListEl.addEventListener('input', e => {
  const row = e.target.closest('.cat-row');
  if (!row) return;
  const cat = state.categories.find(c => c.id === row.dataset.id);
  if (!cat) return;

  if (e.target.dataset.role === 'name') cat.name = e.target.value;
  if (e.target.dataset.role === 'color') cat.color = e.target.value;

  save(); renderTabs(); renderList();
});

catListEl.addEventListener('click', e => {
  if (e.target.dataset.role !== 'del') return;
  const id = e.target.closest('.cat-row').dataset.id;
  const used = state.items.filter(i => i.catId === id).length;

  if (used && !confirm(`这个分类下有 ${used} 条行程，删除后会变成「未分类」。确定删除？`)) return;

  state.categories = state.categories.filter(c => c.id !== id);
  state.items.forEach(i => { if (i.catId === id) i.catId = null; });
  if (activeCat === id) activeCat = 'all';

  save(); renderCatList(); renderAll();
});

document.getElementById('catAdd').addEventListener('click', () => {
  const palette = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#ef4444', '#64748b'];
  state.categories.push({
    id: uid(),
    name: '新分类',
    color: palette[state.categories.length % palette.length]
  });
  save(); renderCatList(); renderAll();
  const rows = catListEl.querySelectorAll('.cat-row');
  const last = rows[rows.length - 1]?.querySelector('input[type=text]');
  if (last) { last.focus(); last.select(); }
});

/* =========================================================
   导出 / 导入
   ========================================================= */
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (state.title || '旅行清单') + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;

  const r = new FileReader();
  r.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data || !Array.isArray(data.items)) throw new Error('格式不对');
      if (!confirm('导入会覆盖当前所有内容，确定继续？')) return;

      state = {
        title: data.title || '旅行清单',
        categories: Array.isArray(data.categories) ? data.categories : [],
        items: data.items
      };
      activeCat = 'all';
      save(); initTitle(); renderAll();
      alert('导入成功');
    } catch (err) {
      alert('导入失败：文件格式不正确');
    }
  };
  r.readAsText(f);
  e.target.value = '';
});

/* =========================================================
   底部面板
   ========================================================= */
const menuMask = document.getElementById('menuMask');
const itemMask = document.getElementById('itemMask');

document.getElementById('menuBtn').addEventListener('click', () => {
  menuMask.classList.add('show');
});

menuMask.addEventListener('click', e => {
  if (e.target === menuMask) { menuMask.classList.remove('show'); return; }
  const btn = e.target.closest('[data-menu]');
  if (!btn) return;
  const act = btn.dataset.menu;
  menuMask.classList.remove('show');

  if (act === 'cat') {
    renderCatList();
    catMask.classList.add('show');
  } else if (act === 'export') {
    exportJSON();
  } else if (act === 'import') {
    document.getElementById('importFile').click();
  } else if (act === 'print') {
    setTimeout(() => window.print(), 120);
  }
});

itemMask.addEventListener('click', e => {
  if (e.target === itemMask) { itemMask.classList.remove('show'); return; }
  const btn = e.target.closest('[data-item]');
  if (!btn) return;
  const act = btn.dataset.item;
  itemMask.classList.remove('show');

  if (!currentItemId) return;

  if (act === 'edit') {
    openEdit(currentItemId);
  } else if (act === 'del') {
    if (confirm('确定删除这条行程？')) {
      state.items = state.items.filter(i => i.id !== currentItemId);
      save(); renderAll();
    }
  }
  currentItemId = null;
});

/* =========================================================
   全局事件
   ========================================================= */
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById(btn.dataset.close).classList.remove('show');
  });
});

[editMask, catMask].forEach(mask => {
  mask.addEventListener('click', e => {
    if (e.target === mask) mask.classList.remove('show');
  });
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.modal-mask.show, .sheet-mask.show').forEach(m => m.classList.remove('show'));
  lightbox.classList.remove('show');
});

document.getElementById('addBtn').addEventListener('click', () => openEdit(null));

titleEl.addEventListener('blur', () => {
  state.title = titleEl.textContent.trim() || '旅行清单';
  titleEl.textContent = state.title;
  document.title = state.title;
  save();
});
titleEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
});

/* =========================================================
   启动
   ========================================================= */
initTitle();
renderAll();
</script>
</body>
</html>
