<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅行清单</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e8ebef;
    --text:#1a1d21; --muted:#8b939c; --dark:#1e293b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px;color:inherit}

  /* ---------- 顶部 ---------- */
  .sticky-top{
    position:sticky;top:0;z-index:20;background:#fff;
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 3px rgba(16,24,40,.04);
  }
  .topbar-inner{
    max-width:820px;margin:0 auto;padding:12px 18px 8px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .title{
    font-size:19px;font-weight:700;letter-spacing:-.01em;
    flex:1;min-width:0;outline:none;border-radius:7px;padding:2px 7px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .title:hover{background:#f4f6f9}
  .title:focus{background:#f1f4f8;white-space:normal}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  .btn{
    border:1px solid var(--line);background:#fff;color:#374151;
    padding:6px 11px;border-radius:8px;font-size:13px;font-weight:500;
    display:inline-flex;align-items:center;gap:4px;transition:.15s;white-space:nowrap;
  }
  .btn:hover{background:#f3f5f8;border-color:#d5dbe3}
  .btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}
  .btn.primary:hover{background:#334155}

  /* ---------- 分类页签 ---------- */
  .tabs{
    max-width:820px;margin:0 auto;padding:2px 18px 10px;
    display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line);background:#fff;color:#4b5563;
    padding:5px 12px;border-radius:99px;font-size:13px;font-weight:500;
    transition:.15s;
  }
  .tab:hover{border-color:#cfd6de}
  .tab.active{background:var(--dark);border-color:var(--dark);color:#fff}
  .tab .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .tab .cnt{font-size:11px;opacity:.55;font-variant-numeric:tabular-nums}

  /* ---------- 清单 ---------- */
  main{max-width:820px;margin:0 auto;padding:16px 18px 90px}
  .item{
    display:flex;gap:14px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:13px 14px;margin-bottom:9px;
    box-shadow:0 1px 2px rgba(16,24,40,.04);
    transition:.15s;
  }
  .item:hover{border-color:#dbe2ea;box-shadow:0 2px 8px rgba(16,24,40,.07)}
  .when{flex:0 0 58px;text-align:right;padding-top:1px}
  .when .date{display:block;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .when .time{
    display:block;font-size:15px;font-weight:700;color:var(--dark);
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  }
  .body{flex:1;min-width:0}
  .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;
    color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);
    white-space:nowrap;flex:0 0 auto;
  }
  .head h3{font-size:15px;font-weight:600;flex:1;min-width:0;word-break:break-word}
  .ops{display:flex;gap:2px;opacity:0;transition:.15s;flex:0 0 auto}
  .item:hover .ops{opacity:1}
  .ops button{
    background:none;border:none;font-size:12px;color:var(--muted);
    padding:3px 7px;border-radius:6px;transition:.15s;
  }
  .ops button:hover{background:#f1f3f6;color:var(--dark)}
  .ops button.danger:hover{background:#fee2e2;color:#dc2626}
  .note{
    font-size:13px;color:#6b7480;margin-top:5px;
    white-space:pre-wrap;word-break:break-word;
  }
  .imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .imgs img{
    width:64px;height:64px;object-fit:cover;border-radius:8px;
    border:1px solid var(--line);cursor:zoom-in;transition:.15s;
  }
  .imgs img:hover{transform:scale(1.04)}

  .empty{
    text-align:center;padding:70px 20px;color:var(--muted);font-size:14px;
  }
  .empty span{font-size:13px;opacity:.75}

  /* ---------- 弹窗 ---------- */
  .modal-mask{
    position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;
    display:none;align-items:center;justify-content:center;padding:16px;
    backdrop-filter:blur(2px);
  }
  .modal-mask.show{display:flex}
  .modal{
    background:#fff;border-radius:16px;width:100%;max-width:520px;
    max-height:90vh;overflow:auto;padding:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    animation:pop .18s ease-out;
  }
  @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
  .modal h2{font-size:17px;margin-bottom:4px}
  .modal .hint{font-size:12px;color:var(--muted);margin-bottom:14px}

  .field{display:block;margin-bottom:13px}
  .field > span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input[type=text],.field input[type=date],.field input[type=time],
  .field select,.field textarea{
    width:100%;border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;background:#fff;outline:none;transition:.15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    border-color:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.15);
  }
  .field textarea{resize:vertical;min-height:68px;line-height:1.55}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .img-grid{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:9px}
  .img-thumb{position:relative;width:72px;height:72px}
  .img-thumb img{width:100%;height:100%;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
  .img-thumb button{
    position:absolute;top:-6px;right:-6px;width:21px;height:21px;border-radius:50%;
    background:var(--dark);color:#fff;border:2px solid #fff;font-size:12px;line-height:1;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .upload{
    display:inline-flex;align-items:center;gap:5px;
    border:1px dashed #cbd3dd;border-radius:9px;padding:8px 14px;
    font-size:13px;color:#5b6472;cursor:pointer;transition:.15s;
  }
  .upload:hover{border-color:#94a3b8;background:#fafbfc}

  .modal-actions{
    display:flex;justify-content:flex-end;gap:8px;
    margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
  }

  /* 分类管理 */
  .cat-row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .cat-row input[type=color]{
    width:34px;height:34px;padding:0;border:1px solid var(--line);
    border-radius:9px;background:none;cursor:pointer;flex:0 0 auto;
  }
  .cat-row input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
  .cat-row input[type=color]::-webkit-color-swatch{border:none;border-radius:6px}
  .cat-row input[type=text]{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;
    padding:8px 11px;outline:none;
  }
  .cat-row input[type=text]:focus{border-color:#94a3b8}
  .cat-row .del{
    background:none;border:none;color:var(--muted);font-size:13px;
    padding:5px 8px;border-radius:7px;flex:0 0 auto;
  }
  .cat-row .del:hover{background:#fee2e2;color:#dc2626}
  .add-cat{width:100%;justify-content:center;margin-top:4px;border-style:dashed}

  /* 图片预览 */
  .lightbox{
    position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;
    display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;
  }
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}

  @media (max-width:560px){
    .topbar-inner{padding:10px 14px 6px;gap:8px}
    .title{flex:1 0 100%;font-size:17px}
    .actions{width:100%}
    .actions .btn{flex:1;justify-content:center;padding:7px 6px;font-size:12px}
    .tabs{padding:2px 14px 9px}
    main{padding:13px 14px 80px}
    .ops{opacity:1}
    .when{flex:0 0 50px}
    .when .time{font-size:14px}
    .imgs img{width:56px;height:56px}
    .row2{grid-template-columns:1fr 1fr;gap:9px}
  }
</style>
</head>
<body>

<div class="sticky-top">
  <div class="topbar-inner">
    <h1 class="title" id="title" contenteditable="true" spellcheck="false"></h1>
    <div class="actions">
      <button class="btn primary" id="addBtn">+ 添加行程</button>
      <button class="btn" id="catBtn">分类</button>
      <button class="btn" id="exportBtn">导出</button>
      <button class="btn" id="importBtn">导入</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>

<main id="list"></main>

<!-- 编辑 / 添加 -->
<div class="modal-mask" id="editMask">
  <div class="modal">
    <h2 id="editTitle">添加行程</h2>
    <p class="hint" id="editHint">时间、分类、图片都可以后面再改</p>

    <div class="row2">
      <label class="field"><span>日期</span><input type="date" id="fDate"></label>
      <label class="field"><span>时间</span><input type="time" id="fTime"></label>
    </div>

    <label class="field"><span>分类</span><select id="fCat"></select></label>
    <label class="field"><span>标题</span><input type="text" id="fTitle" placeholder="例如：抵达天府机场"></label>
    <label class="field"><span>备注</span><textarea id="fNote" placeholder="地址、电话、注意事项……"></textarea></label>

    <div class="field">
      <span>图片</span>
      <div class="img-grid" id="fImgs"></div>
      <label class="upload">+ 添加图片<input type="file" id="fFile" accept="image/*" multiple hidden></label>
    </div>

    <div class="modal-actions">
      <button class="btn" data-close="editMask">取消</button>
      <button class="btn primary" id="fSave">保存</button>
    </div>
  </div>
</div>

<!-- 分类管理 -->
<div class="modal-mask" id="catMask">
  <div class="modal">
    <h2>分类管理</h2>
    <p class="hint">改名字、换颜色，或添加自己的分类</p>
    <div id="catList"></div>
    <button class="btn add-cat" id="catAdd">+ 添加分类</button>
    <div class="modal-actions">
      <button class="btn primary" data-close="catMask">完成</button>
    </div>
  </div>
</div>

<!-- 图片预览 -->
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* =========================================================
   数据层
   ========================================================= */
const LS_KEY = 'travel-list-v1';
const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function defaultState() {
  return {
    title: '我的旅行清单',
    categories: [
      { id: 'c1', name: '交通', color: '#3b82f6' },
      { id: 'c2', name: '景点', color: '#10b981' },
      { id: 'c3', name: '餐饮', color: '#f59e0b' },
      { id: 'c4', name: '住宿', color: '#8b5cf6' },
      { id: 'c5', name: '购物', color: '#ec4899' },
      { id: 'c6', name: '其他', color: '#64748b' }
    ],
    items: [
      { id: uid(), date: '2026-10-01', time: '12:30', catId: 'c1',
        title: '抵达天府机场', note: '出关约 40 分钟，行李在 B 区', images: [] },
      { id: uid(), date: '2026-10-01', time: '16:00', catId: 'c4',
        title: '入住春熙路附近酒店', note: '', images: [] },
      { id: uid(), date: '2026-10-02', time: '07:30', catId: 'c2',
        title: '大熊猫繁育研究基地', note: '越早越好，上午熊猫最活跃', images: [] }
    ]
  };
}

let state;
try {
  state = JSON.parse(localStorage.getItem(LS_KEY)) || defaultState();
  if (!Array.isArray(state.items)) state.items = [];
  if (!Array.isArray(state.categories)) state.categories = [];
} catch (e) { state = defaultState(); }

function save() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  } catch (e) {
    alert('保存失败：本地存储空间不足（多半是图片太多）。\n建议先「导出」备份，再删掉部分图片。');
  }
}

/* =========================================================
   工具
   ========================================================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

const catOf = id => state.categories.find(c => c.id === id);

function fmtDate(d) {
  if (!d) return '';
  const p = String(d).split('-');
  return p.length === 3 ? `${+p[1]}/${+p[2]}` : d;
}

function sortItems(arr) {
  return arr.slice().sort((a, b) => {
    const da = a.date || '9999-12-31', db = b.date || '9999-12-31';
    if (da !== db) return da < db ? -1 : 1;
    const ta = a.time || '99:99', tb = b.time || '99:99';
    return ta < tb ? -1 : ta > tb ? 1 : 0;
  });
}

/* 压缩图片，避免撑爆 localStorage */
function compressImage(file, maxSize = 1000, quality = 0.75) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onerror = () => resolve(null);
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => resolve(null);
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   渲染
   ========================================================= */
const titleEl = document.getElementById('title');
const tabsEl  = document.getElementById('tabs');
const listEl  = document.getElementById('list');
let activeCat = 'all';

function initTitle() {
  titleEl.textContent = state.title || '旅行清单';
  document.title = state.title || '旅行清单';
}

function renderTabs() {
  const counts = {};
  state.items.forEach(it => { counts[it.catId] = (counts[it.catId] || 0) + 1; });

  let html = `<button class="tab ${activeCat === 'all' ? 'active' : ''}" data-cat="all">
      全部<span class="cnt">${state.items.length}</span></button>`;

  state.categories.forEach(c => {
    html += `<button class="tab ${activeCat === c.id ? 'active' : ''}" data-cat="${c.id}">
      <span class="dot" style="background:${c.color}"></span>${esc(c.name)}
      <span class="cnt">${counts[c.id] || 0}</span></button>`;
  });

  tabsEl.innerHTML = html;
}

function itemHTML(it) {
  const c = catOf(it.catId);
  const color = c ? c.color : '#94a3b8';
  const catName = c ? c.name : '未分类';
  const date = fmtDate(it.date);
  const imgs = (it.images || []).map(src => `<img src="${src}" alt="行程图片">`).join('');

  return `
  <article class="item" data-id="${it.id}">
    <div class="when">
      ${date ? `<span class="date">${date}</span>` : ''}
      <span class="time">${it.time || '--:--'}</span>
    </div>
    <div class="body">
      <div class="head">
        <span class="chip" style="--c:${color}">${esc(catName)}</span>
        <h3>${esc(it.title)}</h3>
        <div class="ops">
          <button data-act="edit">编辑</button>
          <button data-act="del" class="danger">删除</button>
        </div>
      </div>
      ${it.note ? `<p class="note">${esc(it.note)}</p>` : ''}
      ${imgs ? `<div class="imgs">${imgs}</div>` : ''}
    </div>
  </article>`;
}

function renderList() {
  const data = sortItems(state.items.filter(
    it => activeCat === 'all' || it.catId === activeCat
  ));

  if (!data.length) {
    listEl.innerHTML = `<div class="empty">这里还没有内容<br><span>点右上角「+ 添加行程」开始记录</span></div>`;
    return;
  }
  listEl.innerHTML = data.map(itemHTML).join('');
}

function renderAll() {
  renderTabs();
  renderList();
}

/* =========================================================
   交互：页签
   ========================================================= */
tabsEl.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  activeCat = tab.dataset.cat;
  renderTabs();
  renderList();
});

/* =========================================================
   交互：清单（编辑 / 删除 / 看图）
   ========================================================= */
listEl.addEventListener('click', e => {
  const img = e.target.closest('.imgs img');
  if (img) { openLightbox(img.src); return; }

  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const id = e.target.closest('.item').dataset.id;

  if (btn.dataset.act === 'edit') {
    openEdit(id);
  } else if (btn.dataset.act === 'del') {
    if (confirm('确定删除这条行程？')) {
      state.items = state.items.filter(i => i.id !== id);
      save(); renderAll();
    }
  }
});

/* 图片预览 */
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('show');
}
lightbox.addEventListener('click', () => {
  lightbox.classList.remove('show');
  lightboxImg.src = '';
});

/* =========================================================
   编辑弹窗
   ========================================================= */
const editMask = document.getElementById('editMask');
let editingId = null;
let editingImages = [];

function openEdit(id) {
  editingId = id || null;
  const it = id ? state.items.find(i => i.id === id) : null;

  document.getElementById('editTitle').textContent = it ? '编辑行程' : '添加行程';
  document.getElementById('editHint').textContent = it
    ? '修改完点保存即可'
    : '时间、分类、图片都可以后面再改';

  document.getElementById('fDate').value = it?.date || '';
  document.getElementById('fTime').value = it?.time || '';

  const sel = document.getElementById('fCat');
  sel.innerHTML = state.categories.length
    ? state.categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')
    : '<option value="">（还没有分类）</option>';
  sel.value = it?.catId || (state.categories[0]?.id || '');

  document.getElementById('fTitle').value = it?.title || '';
  document.getElementById('fNote').value = it?.note || '';

  editingImages = it ? [...(it.images || [])] : [];
  renderEditImages();

  editMask.classList.add('show');
  setTimeout(() => document.getElementById('fTitle').focus(), 60);
}

function renderEditImages() {
  document.getElementById('fImgs').innerHTML = editingImages.map((src, i) => `
    <div class="img-thumb">
      <img src="${src}" alt="">
      <button type="button" data-rm="${i}" title="移除">×</button>
    </div>`).join('');
}

document.getElementById('fImgs').addEventListener('click', e => {
  const b = e.target.closest('[data-rm]');
  if (!b) return;
  editingImages.splice(+b.dataset.rm, 1);
  renderEditImages();
});

document.getElementById('fFile').addEventListener('change', async e => {
  const files = [...e.target.files];
  for (const f of files) {
    const data = await compressImage(f);
    if (data) editingImages.push(data);
  }
  e.target.value = '';
  renderEditImages();
});

document.getElementById('fSave').addEventListener('click', () => {
  const titleEl2 = document.getElementById('fTitle');
  const title = titleEl2.value.trim();
  if (!title) {
    titleEl2.focus();
    titleEl2.style.borderColor = '#f87171';
    setTimeout(() => titleEl2.style.borderColor = '', 1200);
    return;
  }

  const data = {
    date: document.getElementById('fDate').value,
    time: document.getElementById('fTime').value,
    catId: document.getElementById('fCat').value || null,
    title,
    note: document.getElementById('fNote').value.trim(),
    images: editingImages
  };

  if (editingId) {
    Object.assign(state.items.find(i => i.id === editingId), data);
  } else {
    state.items.push({ id: uid(), ...data });
  }

  save();
  editMask.classList.remove('show');
  renderAll();
});

/* =========================================================
   分类管理
   ========================================================= */
const catMask = document.getElementById('catMask');
const catListEl = document.getElementById('catList');

function renderCatList() {
  catListEl.innerHTML = state.categories.map(c => `
    <div class="cat-row" data-id="${c.id}">
      <input type="color" value="${c.color}" data-role="color" title="换颜色">
      <input type="text" value="${esc(c.name)}" data-role="name" placeholder="分类名">
      <button class="del" data-role="del" title="删除分类">删除</button>
    </div>`).join('') || '<p class="hint" style="margin:0 0 10px">还没有分类，点下面添加</p>';
}

catListEl.addEventListener('input', e => {
  const row = e.target.closest('.cat-row');
  if (!row) return;
  const cat = state.categories.find(c => c.id === row.dataset.id);
  if (!cat) return;

  if (e.target.dataset.role === 'name') cat.name = e.target.value;
  if (e.target.dataset.role === 'color') cat.color = e.target.value;

  save(); renderTabs(); renderList();
});

catListEl.addEventListener('click', e => {
  if (e.target.dataset.role !== 'del') return;
  const id = e.target.closest('.cat-row').dataset.id;
  const used = state.items.filter(i => i.catId === id).length;

  if (used && !confirm(`这个分类下有 ${used} 条行程，删除后它们会变成「未分类」。确定删除吗？`)) return;

  state.categories = state.categories.filter(c => c.id !== id);
  state.items.forEach(i => { if (i.catId === id) i.catId = null; });
  if (activeCat === id) activeCat = 'all';

  save(); renderCatList(); renderAll();
});

document.getElementById('catAdd').addEventListener('click', () => {
  const palette = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#ef4444', '#64748b'];
  state.categories.push({
    id: uid(),
    name: '新分类',
    color: palette[state.categories.length % palette.length]
  });
  save(); renderCatList(); renderAll();
  // 聚焦到新分类的输入框
  const rows = catListEl.querySelectorAll('.cat-row');
  const last = rows[rows.length - 1]?.querySelector('input[type=text]');
  if (last) { last.focus(); last.select(); }
});

/* =========================================================
   导出 / 导入
   ========================================================= */
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (state.title || '旅行清单') + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;

  const r = new FileReader();
  r.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data || !Array.isArray(data.items)) throw new Error('格式不对');
      if (!confirm('导入会覆盖当前所有内容，确定继续？')) return;

      state = {
        title: data.title || '旅行清单',
        categories: Array.isArray(data.categories) ? data.categories : [],
        items: data.items
      };
      activeCat = 'all';
      save(); initTitle(); renderAll();
      alert('导入成功');
    } catch (err) {
      alert('导入失败：文件格式不正确');
    }
  };
  r.readAsText(f);
  e.target.value = '';
});

/* =========================================================
   全局事件
   ========================================================= */
// 关闭弹窗
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById(btn.dataset.close).classList.remove('show');
  });
});

// 点遮罩关闭
[editMask, catMask].forEach(mask => {
  mask.addEventListener('click', e => {
    if (e.target === mask) mask.classList.remove('show');
  });
});

// Esc 关闭
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.modal-mask.show').forEach(m => m.classList.remove('show'));
  lightbox.classList.remove('show');
});

// 添加行程
document.getElementById('addBtn').addEventListener('click', () => openEdit(null));

// 分类管理
document.getElementById('catBtn').addEventListener('click', () => {
  renderCatList();
  catMask.classList.add('show');
});

// 标题编辑
titleEl.addEventListener('blur', () => {
  state.title = titleEl.textContent.trim() || '旅行清单';
  titleEl.textContent = state.title;
  document.title = state.title;
  save();
});
titleEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
});

/* =========================================================
   启动
   ========================================================= */
initTitle();
renderAll();
</script>
</body>
</html>
